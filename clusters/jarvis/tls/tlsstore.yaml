apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: kube-system
spec:
  defaultCertificate:
    secretName: lan-tls
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
  namespace: apps
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: chat-http-redirect
  namespace: apps
spec:
  entryPoints: [web]
  routes:
    - match: Host(`chat.lan`) || Host(`jarvis.lan`) || Host(`home.lan`)
      kind: Rule
      middlewares:
        - name: https-redirect
      services:
        - name: open-webui
          port: 8080

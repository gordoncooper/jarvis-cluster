apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-gpu-exporter
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: nvidia-gpu-exporter
  template:
    metadata:
      labels:
        app: nvidia-gpu-exporter
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        jarvis.role: gpu
      containers:
        - name: exporter
          image: docker.io/utkuozdemir/nvidia_gpu_exporter:1.2.1@sha256:50e9be96ce3f67a75d7fd3834f2372d295c3dfcf044a36c9235e19ea7f008e58
          imagePullPolicy: IfNotPresent
          args:
            - --query-field-names=index,uuid,name,driver_version,pstate,temperature.gpu,utilization.gpu,utilization.memory,memory.used,memory.total,fan.speed,power.draw,clocks.current.graphics,clocks.current.memory
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: utility
          ports:
            - name: metrics
              containerPort: 9835
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: nvidia-gpu-exporter
  namespace: monitoring
  labels: { app: nvidia-gpu-exporter }
spec:
  clusterIP: None
  selector: { app: nvidia-gpu-exporter }
  ports:
    - { name: metrics, port: 9835, targetPort: metrics }

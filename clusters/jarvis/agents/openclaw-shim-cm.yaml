apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-openai-shim
  namespace: agents
data:
  openai-shim.py: |
    #!/usr/bin/env python3
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    import json, os, subprocess, traceback, uuid
    
    PORT = int(os.environ.get("SHIM_PORT", "4001"))
    TIMEOUT = int(os.environ.get("OPENCLAW_ASK_TIMEOUT", "300"))
    
    
    def last_user(body):
        for m in reversed(body.get("messages") or []):
            if m.get("role") != "user":
                continue
            c = m.get("content")
            if isinstance(c, list):
                return "".join(
                    (x.get("text") or "") if isinstance(x, dict) else str(x) for x in c
                )
            return str(c or "")
        return ""
    
    
    def extract_text(raw):
        try:
            d = json.loads(raw)
        except Exception:
            return (raw or "").strip()[:8000]
        res = d.get("result") or d
        texts = [
            p.get("text")
            for p in (res.get("payloads") or [])
            if isinstance(p, dict) and p.get("text")
        ]
        vis = ((res.get("meta") or {}).get("finalAssistantVisibleText"))
        if vis:
            return str(vis)
        if texts:
            return texts[-1]
        if d.get("status") and d.get("status") != "ok":
            return "Hands: " + str(d.get("summary") or d.get("status"))
        return (raw or "").strip()[:4000]
    
    
    def run_agent(msg):
        msg = (msg or "ping")[:8000]
        sid = "agent:main:" + uuid.uuid4().hex[:12]
        try:
            p = subprocess.run(
                [
                    "openclaw", "agent",
                    "--session-key", sid,
                    "--message", msg,
                    "--timeout", str(TIMEOUT),
                    "--json",
                ],
                capture_output=True,
                text=True,
                timeout=TIMEOUT + 30,
            )
        except subprocess.TimeoutExpired:
            return "Hands timed out waiting for OpenClaw. The action may still have completed; check the cluster."
        raw = (p.stdout or "").strip()
        if not raw:
            err = (p.stderr or "").strip()[-1500:]
            return "Hands empty reply" + ((": " + err) if err else "")
        return extract_text(raw)
    
    
    class H(BaseHTTPRequestHandler):
        def log_message(self, fmt, *args):
            print("[shim]", fmt % args, flush=True)
    
        def _send(self, code, obj, ctype="application/json"):
            b = json.dumps(obj).encode() if not isinstance(obj, (bytes, bytearray)) else obj
            if not isinstance(obj, (bytes, bytearray)):
                b = json.dumps(obj).encode()
            self.send_response(code)
            self.send_header("Content-Type", ctype)
            self.send_header("Content-Length", str(len(b)))
            self.end_headers()
            self.wfile.write(b)
    
        def do_GET(self):
            path = self.path.split("?")[0]
            if path in ("/healthz", "/health", "/ready"):
                self._send(200, {"ok": True})
                return
            self._send(404, {"error": "not found"})
    
        def do_POST(self):
            n = int(self.headers.get("Content-Length") or 0)
            try:
                body = json.loads(self.rfile.read(n) or b"{}")
            except Exception:
                self._send(400, {"error": "bad json"})
                return
            path = self.path.split("?")[0]
            if path not in ("/v1/chat/completions", "/chat/completions"):
                self._send(404, {"error": "not found"})
                return
            stream = bool(body.get("stream"))
            try:
                text = run_agent(last_user(body))
            except Exception:
                text = "Hands error:\n" + traceback.format_exc()[-1500:]
            if stream:
                self.send_response(200)
                self.send_header("Content-Type", "text/event-stream")
                self.send_header("Cache-Control", "no-cache")
                self.end_headers()
                chunk = {
                    "id": "chatcmpl-hands",
                    "object": "chat.completion.chunk",
                    "model": "jarvis-hands",
                    "choices": [{
                        "index": 0,
                        "delta": {"role": "assistant", "content": text},
                        "finish_reason": None,
                    }],
                }
                done = {
                    "id": "chatcmpl-hands",
                    "object": "chat.completion.chunk",
                    "model": "jarvis-hands",
                    "choices": [{"index": 0, "delta": {}, "finish_reason": "stop"}],
                }
                self.wfile.write(b"data: " + json.dumps(chunk).encode() + b"\n\n")
                self.wfile.write(b"data: " + json.dumps(done).encode() + b"\n\n")
                self.wfile.write(b"data: [DONE]\n\n")
                return
            self._send(200, {
                "id": "chatcmpl-hands",
                "object": "chat.completion",
                "model": "jarvis-hands",
                "choices": [{
                    "index": 0,
                    "message": {"role": "assistant", "content": text},
                    "finish_reason": "stop",
                }],
            })
    
    
    if __name__ == "__main__":
        ThreadingHTTPServer(("0.0.0.0", PORT), H).serve_forever()

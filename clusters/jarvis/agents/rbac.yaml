apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openclaw-recycle
  namespace: monitoring
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [patch]
  - apiGroups: [""]

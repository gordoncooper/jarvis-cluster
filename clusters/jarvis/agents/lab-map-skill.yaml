apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-skill-lab-map
  namespace: agents
data:
  SKILL.md: |
    ---
    name: lab-map
    description: Canonical JARVIS URLs and when to use each surface. Read this instead of curling Homepage or Traefik.
    ---
    Never curl, wget, or scrape HTML to discover URLs. This file is the map.

    Product first (daily path):

    | the operator opens | URL | For |
    |---|---|---|
    | Product glass | https://jarvis.lan | Daily talk, voice, memory |
    | NOC | https://noc.lan | Nodes, workloads, alerts |
    | Chat (break-glass) | https://chat.lan | OWUI when glass is down |
    | Agent (break-glass) | http://agent.lan:18789 | Free-form OpenClaw UI |
    | Grafana | https://grafana.lan | Graphs |
    | Git (Flux origin) | http://git.lan | cluster YAML (HTTP on purpose) |
    | LLM API | https://llm.lan/v1 | OpenAI-shaped; Goose uses this |

    Product Hands (jarvis.lan) uses constrained verbs via the openai-shim
    `POST /v1/verbs` — not free-form agent chat. Free-form agent is break-glass only.

    Node count: `node /home/node/.openclaw/skills/cluster-health/k8s.js nodes`
    GPU temp: `node /home/node/.openclaw/skills/cluster-metrics/prom.js nvidia_smi_temperature_gpu`
    Do not use MEMORY.md for live facts. Do not repeat a failed or empty command.

    You MAY run ls -la /cluster/local (read-only hostPath on apps-01). Do not delete. Do not SSH. Do not touch host /.

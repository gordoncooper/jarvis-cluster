---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: piper
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: piper
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: piper
    spec:
      nodeSelector:
        jarvis.role: apps
      containers:
        - name: piper
          image: ghcr.io/matatonic/openedai-speech-min:latest@sha256:e82d719252fb1b861967f4f9abb8513f028ab9c1139451245688dbf34992b060
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: TTS_HOME
              value: voices
            - name: HF_HOME
              value: voices
          volumeMounts:
            - name: voices
              mountPath: /app/voices
            - name: config
              mountPath: /app/config
            - name: voice-map
              mountPath: /app/config/voice_to_speaker.yaml
              subPath: voice_to_speaker.yaml
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: voices
          hostPath:
            path: /cluster/local/piper
            type: DirectoryOrCreate
        - name: config
          emptyDir: {}
        - name: voice-map
          configMap:
            name: piper-voice-map
---
apiVersion: v1
kind: Service
metadata:
  name: piper
  namespace: apps
spec:
  selector:
    app: piper
  ports:
    - name: http
      port: 8000
      targetPort: http

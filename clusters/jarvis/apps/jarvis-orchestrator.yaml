apiVersion: v1
kind: ServiceAccount
metadata:
  name: jarvis-orchestrator
  namespace: apps
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jarvis-briefing-blurb
  namespace: apps
data:
  briefing.md: |
    The lab is a physical LAN rack (192.168.8.0/24): bastion, ctrl-01, gpu-01,
    gpu-02, data-01, data-02, apps-01. Operator is Gordon. Product surface is
    jarvis.lan. Live numbers come from the cluster, not from memory.
  greeting: "Good evening, Gordon."
  blurb: "Jarvis lab · LAN rack · ask me anything."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jarvis-orchestrator
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels: { app: jarvis-orchestrator }
  strategy: { type: Recreate }
  template:
    metadata:
      labels: { app: jarvis-orchestrator }
    spec:
      serviceAccountName: jarvis-orchestrator
      nodeSelector:
        jarvis.role: apps
      containers:
        - name: orchestrator
          image: docker.io/library/jarvis-orchestrator:v0.6.0
          imagePullPolicy: Never
          env:
            - name: LITELLM_BASE
              value: http://litellm.inference.svc.cluster.local:4000
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: jarvis-orchestrator
                  key: LITELLM_API_KEY
            - name: TALKER_MODEL
              value: jarvis-local
            - name: MOCK_LLM
              value: "0"
            - name: PERSONA_PATH
              value: /etc/jarvis/persona.txt
            - name: BRIEFING_PATH
              value: /etc/jarvis/briefing.md
            - name: GREETING
              valueFrom:
                configMapKeyRef:
                  name: jarvis-briefing-blurb
                  key: greeting
            - name: BRIEFING_BLURB
              valueFrom:
                configMapKeyRef:
                  name: jarvis-briefing-blurb
                  key: blurb
          ports:
            - { name: http, containerPort: 8080 }
          volumeMounts:
            - name: persona
              mountPath: /etc/jarvis/persona.txt
              subPath: system.txt
              readOnly: true
            - name: briefing
              mountPath: /etc/jarvis/briefing.md
              subPath: briefing.md
              readOnly: true
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: persona
          configMap:
            name: jarvis-persona
        - name: briefing
          configMap:
            name: jarvis-briefing-blurb
---
apiVersion: v1
kind: Service
metadata:
  name: jarvis-orchestrator
  namespace: apps
spec:
  selector: { app: jarvis-orchestrator }
  ports:
    - { name: http, port: 8080, targetPort: http }

apiVersion: v1
kind: ServiceAccount
metadata:
  name: jarvis-orchestrator
  namespace: apps
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jarvis-briefing-blurb
  namespace: apps
data:
  briefing.md: |
    ## Lab
    The lab is a physical LAN rack (192.168.8.0/24): bastion, ctrl-01, gpu-01,
    gpu-02, data-01, data-02, apps-01. Operator is Gordon. Product surface is
    jarvis.lan. Live numbers come from the cluster, not from memory.

    ## Focus
    Do not invent live cluster numbers. Hands owns verbs.
  greeting: "Good evening, Gordon."
  blurb: "Jarvis lab · LAN rack · ask me anything."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jarvis-orchestrator
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels: { app: jarvis-orchestrator }
  strategy: { type: Recreate }
  template:
    metadata:
      labels: { app: jarvis-orchestrator }
    spec:
      serviceAccountName: jarvis-orchestrator
      nodeSelector:
        jarvis.role: apps
      containers:
        - name: orchestrator
          image: docker.io/library/jarvis-orchestrator:v0.6.20
          imagePullPolicy: Never
          env:
            - name: LITELLM_BASE
              value: http://litellm.inference.svc.cluster.local:4000
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: jarvis-orchestrator
                  key: LITELLM_API_KEY
            - name: TALKER_MODEL
              value: jarvis-local
            - name: MOCK_LLM
              value: "0"
            - name: PERSONA_PATH
              value: /etc/jarvis/persona.txt
            - name: BRIEFING_PATH
              value: /etc/jarvis/briefing.md
            # D-0012: only the orchestrator reads Prometheus; glass sees /v1/pulse.
            - name: PROMETHEUS_BASE
              value: http://prometheus.monitoring.svc.cluster.local:9090
            # Real weather for the CMD header. Unset lat/lon hides the chip.
            - name: WEATHER_LAT
              value: "34.05"
            - name: WEATHER_LON
              value: "-118.24"
            - name: WEATHER_PLACE
              value: Los Angeles
            - name: WEATHER_TZ
              value: America/Los_Angeles
            - name: MEMORY_DB_PATH
              value: /var/lib/jarvis/promoted.sqlite
            - name: SESSION_DB_PATH
              value: /var/lib/jarvis/sessions.sqlite
            - name: GREETING
              valueFrom:
                configMapKeyRef:
                  name: jarvis-briefing-blurb
                  key: greeting
            - name: BRIEFING_BLURB
              valueFrom:
                configMapKeyRef:
                  name: jarvis-briefing-blurb
                  key: blurb
          ports:
            - { name: http, containerPort: 8080 }
          volumeMounts:
            - name: persona
              mountPath: /etc/jarvis/persona.txt
              subPath: system.txt
              readOnly: true
            - name: briefing
              mountPath: /etc/jarvis/briefing.md
              subPath: briefing.md
              readOnly: true
            - name: jarvis-data
              mountPath: /var/lib/jarvis
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: persona
          configMap:
            name: jarvis-persona
        - name: briefing
          configMap:
            name: jarvis-briefing-blurb
        - name: jarvis-data
          hostPath:
            path: /mnt/nfs/jarvis
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: jarvis-orchestrator
  namespace: apps
spec:
  selector: { app: jarvis-orchestrator }
  ports:
    - { name: http, port: 8080, targetPort: http }

apiVersion: v1
kind: ConfigMap
metadata:
  name: jarvis-webui-hud
  namespace: apps
  annotations:
    jarvis.hud: "v6 wordmark + live pip — generic html/body/#app/aside"
data:
  jarvis-hud.css: |
    /* JARVIS HUD v6 — bigger wordmark, live pip, inner vignette. Grid heartbeat unchanged. */
    :root {
      --jarvis-bg: #07090b;
      --jarvis-panel: #0b1014;
      --jarvis-cyan: #5eead4;
      --jarvis-text: #d5e6ea;
      --jarvis-line: rgba(94, 234, 212, 0.32);
    }
    html, body, #app,
    #app > div,
    main {
      background-color: var(--jarvis-bg) !important;
      color: var(--jarvis-text);
      background-image: none !important;
    }
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--jarvis-cyan) 0%, var(--jarvis-cyan) 22%, transparent 72%);
      z-index: 9999;
      pointer-events: none;
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        linear-gradient(rgba(94, 234, 212, 0.18) 1px, transparent 1px),
        linear-gradient(90deg, rgba(94, 234, 212, 0.18) 1px, transparent 1px);
      background-size: 28px 28px;
      -webkit-mask-image: radial-gradient(ellipse 70% 58% at 58% 42%, #000 0%, #000 32%, rgba(0,0,0,0.55) 58%, transparent 82%);
      mask-image: radial-gradient(ellipse 70% 58% at 58% 42%, #000 0%, #000 32%, rgba(0,0,0,0.55) 58%, transparent 82%);
      animation: jarvis-grid-pulse 5.5s ease-in-out infinite;
    }
    @keyframes jarvis-grid-pulse {
      0%, 100% { opacity: 0.42; }
      10% { opacity: 0.95; }
      22% { opacity: 0.48; }
      34% { opacity: 0.82; }
      48% { opacity: 0.42; }
    }
    @keyframes jarvis-live {
      0%, 100% { opacity: 0.45; box-shadow: 0 0 4px var(--jarvis-cyan); }
      50% { opacity: 1; box-shadow: 0 0 10px var(--jarvis-cyan); }
    }
    @media (prefers-reduced-motion: reduce) {
      body::after { animation: none; opacity: 0.7; }
      aside .self-center.font-medium::before,
      #sidebar .self-center.font-medium::before { animation: none; }
    }
    #app, main, #sidebar, aside { position: relative; z-index: 1; }
    #app { box-shadow: inset 0 0 120px rgba(0, 0, 0, 0.55); }
    #sidebar, aside {
      background: var(--jarvis-panel) !important;
      box-shadow: inset 3px 0 0 var(--jarvis-cyan) !important;
      border-right: 1px solid var(--jarvis-line) !important;
    }
    .bg-white, .bg-gray-50, .bg-gray-100, .bg-gray-200,
    .bg-gray-800, .bg-gray-850, .bg-gray-900, .bg-gray-950,
    .dark .bg-white, .dark .bg-gray-50,
    .dark .bg-gray-800, .dark .bg-gray-900, .dark .bg-gray-950 {
      background-color: var(--jarvis-bg) !important;
    }
    #sidebar .font-medium,
    aside .font-medium {
      color: var(--jarvis-cyan) !important;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace !important;
    }
    aside .self-center.font-medium,
    #sidebar .self-center.font-medium,
    aside .self-center {
      font-size: 22px !important;
      font-weight: 700 !important;
      letter-spacing: 0.34em !important;
      text-transform: uppercase !important;
      line-height: 1.15 !important;
      text-shadow: 0 0 16px rgba(94, 234, 212, 0.55), 0 0 2px var(--jarvis-cyan);
      padding: 10px 4px 8px 0 !important;
      border-bottom: 1px solid var(--jarvis-line);
    }
    aside .self-center.font-medium::before,
    #sidebar .self-center.font-medium::before,
    aside .self-center::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 10px;
      margin-bottom: 2px;
      background: var(--jarvis-cyan);
      box-shadow: 0 0 8px var(--jarvis-cyan);
      animation: jarvis-live 2.4s ease-in-out infinite;
      vertical-align: middle;
    }
    #sidebar a img, aside a img, #sidebar a svg {
      display: none !important;
    }
    a[href*="openwebui.com"],
    a[href*="github.com/open-webui"] {
      display: none !important;
    }
    textarea {
      caret-color: var(--jarvis-cyan);
      box-shadow: 0 0 0 1px var(--jarvis-line);
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(94, 234, 212, 0.35); }
    ::-webkit-scrollbar-track { background: var(--jarvis-bg); }
  jarvis-hud.js: |
    (function () {
      function once() {
        try {
          document.title = "JARVIS";
          var nodes = document.querySelectorAll("aside *, #sidebar *");
          for (var i = 0; i < nodes.length; i++) {
            var el = nodes[i];
            if (el.childNodes.length !== 1 || el.childNodes[0].nodeType !== 3) continue;
            var t = el.childNodes[0].nodeValue;
            if (t && t.indexOf("(Open WebUI)") !== -1) {
              el.childNodes[0].nodeValue = t.replace(/\s*\(Open WebUI\)/g, "");
            }
          }
        } catch (e) {}
      }
      setTimeout(once, 400);
      setTimeout(once, 1600);
    })();
  inject-hud.sh: |
    #!/bin/bash
    set -euo pipefail
    python3 - << 'HUDPY'
    from pathlib import Path
    import re
    css = Path("/hud/jarvis-hud.css").read_text()
    js = Path("/hud/jarvis-hud.js").read_text()
    p = Path("/app/build/index.html")
    t = p.read_text()
    t = re.sub(r"<!--jarvis-hud-->.*?<!--/jarvis-hud-->", "", t, flags=re.S)
    block = (
        "<!--jarvis-hud-->"
        "<style id=\"jarvis-hud\">" + css + "</style>"
        "<script id=\"jarvis-hud-js\">" + js + "</script>"
        "<!--/jarvis-hud-->"
    )
    if "</head>" in t:
        t = t.replace("</head>", block + "\n</head>", 1)
    else:
        t = block + t
    t = t.replace("<title>Open WebUI</title>", "<title>JARVIS</title>")
    p.write_text(t)
    print("hud v6 injected", len(css), len(js), flush=True)
    HUDPY
    for s in /app/backend/start.sh /app/start.sh start.sh; do
      if [ -f "$s" ]; then exec bash "$s"; fi
    done
    echo "FATAL: no start.sh" >&2
    exit 1

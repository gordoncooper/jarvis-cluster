apiVersion: v1
kind: ConfigMap
metadata:
  name: jarvis-webui-hud
  namespace: apps
data:
  jarvis-hud.css: |
    /* JARVIS HUD v2 — Open WebUI 0.11.3. Composer/mic/TTS untouched. */
    :root {
      --jarvis-bg: #07090b;
      --jarvis-panel: #0b1014;
      --jarvis-cyan: #5eead4;
      --jarvis-text: #d5e6ea;
      --jarvis-line: rgba(94, 234, 212, 0.28);
    }
    html, body, #app {
      background: var(--jarvis-bg) !important;
    }
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--jarvis-cyan), transparent 65%);
      z-index: 9999;
      pointer-events: none;
    }
    #sidebar,
    aside {
      background: var(--jarvis-panel) !important;
      box-shadow: inset 3px 0 0 var(--jarvis-cyan) !important;
      border-right: 1px solid var(--jarvis-line) !important;
    }
  jarvis-hud.js: |
    (function () {
      function strip(s) {
        return String(s || "")
          .replace(/\s*\(Open WebUI\)/g, "")
          .replace(/^Open WebUI$/, "JARVIS");
      }
      function walk(root) {
        document.title = strip(document.title) || "JARVIS";
        var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
        var n;
        while ((n = w.nextNode())) {
          if (n.nodeValue && n.nodeValue.indexOf("Open WebUI") !== -1) {
            n.nodeValue = strip(n.nodeValue);
          }
        }
      }
      walk(document);
      new MutationObserver(function () { walk(document.body || document); })
        .observe(document.documentElement, { childList: true, subtree: true, characterData: true });
    })();
  inject-hud.sh: |
    #!/bin/bash
    set -euo pipefail
    python3 - << 'HUDPY'
    from pathlib import Path
    import re
    css = Path("/hud/jarvis-hud.css").read_text()
    js = Path("/hud/jarvis-hud.js").read_text()
    p = Path("/app/build/index.html")
    t = p.read_text()
    t = re.sub(r"<!--jarvis-hud-->.*?<!--/jarvis-hud-->", "", t, flags=re.S)
    block = (
        "<!--jarvis-hud-->"
        "<style id=\"jarvis-hud\">" + css + "</style>"
        "<script id=\"jarvis-hud-js\">" + js + "</script>"
        "<!--/jarvis-hud-->"
    )
    if "</head>" in t:
        t = t.replace("</head>", block + "\n</head>", 1)
    else:
        t = block + t
    t = t.replace("<title>Open WebUI</title>", "<title>JARVIS</title>")
    p.write_text(t)
    print("hud v2 injected", "css", len(css), "js", len(js), flush=True)
    HUDPY
    for s in /app/backend/start.sh /app/start.sh start.sh; do
      if [ -f "$s" ]; then
        echo "exec $s" >&2
        exec bash "$s"
      fi
    done
    echo "FATAL: no start.sh" >&2
    exit 1

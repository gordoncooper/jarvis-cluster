apiVersion: v1
kind: ConfigMap
metadata:
  name: jarvis-webui-hud
  namespace: apps
data:
  jarvis-hud.css: |
    /* JARVIS HUD — CSS only. No MutationObserver. */
    :root {
      --jarvis-bg: #07090b;
      --jarvis-panel: #0b1014;
      --jarvis-cyan: #5eead4;
      --jarvis-line: rgba(94, 234, 212, 0.28);
    }
    html, body, #app { background: var(--jarvis-bg) !important; }
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--jarvis-cyan), transparent 65%);
      z-index: 9999;
      pointer-events: none;
    }
    #sidebar, aside {
      background: var(--jarvis-panel) !important;
      box-shadow: inset 3px 0 0 var(--jarvis-cyan) !important;
      border-right: 1px solid var(--jarvis-line) !important;
    }
  inject-hud.sh: |
    #!/bin/bash
    set -euo pipefail
    python3 - << 'HUDPY'
    from pathlib import Path
    import re
    css = Path("/hud/jarvis-hud.css").read_text()
    p = Path("/app/build/index.html")
    t = p.read_text()
    t = re.sub(r"<!--jarvis-hud-->.*?<!--/jarvis-hud-->", "", t, flags=re.S)
    block = "<!--jarvis-hud--><style id=\"jarvis-hud\">" + css + "</style><!--/jarvis-hud-->"
    if "</head>" in t:
        t = t.replace("</head>", block + "\n</head>", 1)
    else:
        t = block + t
    t = t.replace("<title>Open WebUI</title>", "<title>JARVIS</title>")
    p.write_text(t)
    print("hud css-only injected", len(css), flush=True)
    HUDPY
    for s in /app/backend/start.sh /app/start.sh start.sh; do
      if [ -f "$s" ]; then exec bash "$s"; fi
    done
    echo "FATAL: no start.sh" >&2
    exit 1

apiVersion: v1
kind: ConfigMap
metadata:
  name: jarvis-webui-hud
  namespace: apps
  annotations:
    jarvis.hud: "v10d dialog Confirm contrast"
data:
  jarvis-hud.css: |
    /* JARVIS HUD v8 — wordmark survives sidebar toggle; model name HUD. */
    :root {
      --jarvis-bg: #07090b;
      --jarvis-panel: #0b1014;
      --jarvis-cyan: #5eead4;
      --jarvis-text: #d5e6ea;
      --jarvis-line: rgba(94, 234, 212, 0.32);
    }
    html, body, #app, #app > div, main {
      background-color: var(--jarvis-bg) !important;
      color: var(--jarvis-text);
      background-image: none !important;
    }
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--jarvis-cyan) 0%, var(--jarvis-cyan) 22%, transparent 72%);
      z-index: 9999;
      pointer-events: none;
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        linear-gradient(rgba(94, 234, 212, 0.18) 1px, transparent 1px),
        linear-gradient(90deg, rgba(94, 234, 212, 0.18) 1px, transparent 1px);
      background-size: 28px 28px;
      -webkit-mask-image: radial-gradient(ellipse 70% 58% at 58% 42%, #000 0%, #000 32%, rgba(0,0,0,0.55) 58%, transparent 82%);
      mask-image: radial-gradient(ellipse 70% 58% at 58% 42%, #000 0%, #000 32%, rgba(0,0,0,0.55) 58%, transparent 82%);
      animation: jarvis-grid-pulse 5.5s ease-in-out infinite;
    }
    @keyframes jarvis-grid-pulse {
      0%, 100% { opacity: 0.42; }
      10% { opacity: 0.95; }
      22% { opacity: 0.48; }
      34% { opacity: 0.82; }
      48% { opacity: 0.42; }
    }
    @keyframes jarvis-live {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      body::after { animation: none; opacity: 0.7; }
      [data-jarvis-mark]::before { animation: none; }
    }
    #app, main, #sidebar, aside { position: relative; z-index: 1; }
    #app { box-shadow: inset 0 0 120px rgba(0, 0, 0, 0.55); }
    #sidebar, aside {
      background: var(--jarvis-panel) !important;
      box-shadow: inset 3px 0 0 var(--jarvis-cyan) !important;
      border-right: 1px solid var(--jarvis-line) !important;
    }
    .bg-white, .bg-gray-50, .bg-gray-100, .bg-gray-200,
    .bg-gray-800, .bg-gray-850, .bg-gray-900, .bg-gray-950,
    .dark .bg-white, .dark .bg-gray-50,
    .dark .bg-gray-800, .dark .bg-gray-900, .dark .bg-gray-950 {
      background-color: var(--jarvis-bg) !important;
    }
    [role="dialog"], [role="alertdialog"] {
      background: var(--jarvis-panel) !important;
      color: var(--jarvis-text) !important;
      border: 1px solid var(--jarvis-line) !important;
    }
    [role="dialog"] button, [role="alertdialog"] button {
      color: var(--jarvis-text) !important;
      opacity: 1 !important;
    }
    [role="dialog"] button:last-of-type,
    [role="alertdialog"] button:last-of-type {
      color: #5eead4 !important;
    }
    [data-jarvis-mark] {
      font-size: 22px !important;
      font-weight: 700 !important;
      letter-spacing: 0.32em !important;
      text-transform: uppercase !important;
      color: var(--jarvis-cyan) !important;
      text-shadow: 0 0 16px rgba(94, 234, 212, 0.55), 0 0 2px var(--jarvis-cyan) !important;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace !important;
      line-height: 1.2 !important;
      padding: 10px 0 8px 0 !important;
      border-bottom: 1px solid var(--jarvis-line) !important;
      display: inline-block !important;
    }
    [data-jarvis-mark]::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 10px;
      background: var(--jarvis-cyan);
      box-shadow: 0 0 10px var(--jarvis-cyan);
      animation: jarvis-live 2.4s ease-in-out infinite;
      vertical-align: middle;
    }
    [data-jarvis-model] {
      font-size: 20px !important;
      font-weight: 600 !important;
      letter-spacing: 0.22em !important;
      text-transform: uppercase !important;
      color: var(--jarvis-cyan) !important;
      text-shadow: 0 0 14px rgba(94, 234, 212, 0.45);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace !important;
    }
    [data-jarvis-foot] { display: none !important; }
    #sidebar a img, aside a img, #sidebar a svg { display: none !important; }
    a[href*="openwebui.com"], a[href*="github.com/open-webui"] { display: none !important; }
    textarea { caret-color: var(--jarvis-cyan); }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(94, 234, 212, 0.35); }
    ::-webkit-scrollbar-track { background: var(--jarvis-bg); }
    /* v8b: model picker stays stock; empty-state title stays HUD */
    button [data-jarvis-model],
    [role="button"] [data-jarvis-model],
    [role="menu"] [data-jarvis-model],
    [role="listbox"] [data-jarvis-model] {
      font-size: inherit !important;
      font-weight: inherit !important;
      letter-spacing: normal !important;
      text-transform: none !important;
      color: inherit !important;
      text-shadow: none !important;
      font-family: inherit !important;
    }

    main *:has(> [data-jarvis-mark]) > img,
    main *:has(> [data-jarvis-mark]) > svg,
    main *:has(> [data-jarvis-mark]) > button:has(img),
    main *:has(> [data-jarvis-mark]) > button:has(svg),
    main *:has(> img):has(+ *:has([data-jarvis-mark])),
    main *:has(> svg):has(+ *:has([data-jarvis-mark])),
    main *:has(> button):has(+ *:has([data-jarvis-mark])) {
      display: none !important;
    }
  jarvis-hud.js: |
    (function () {
)();

      try {
        localStorage.setItem("sidebar", "false");
        localStorage.setItem("showSidebar", "false");
      } catch (e) {}
    
      function once() {
        try {
          document.title = "JARVIS";
          function hideOwl(el) {
            if (el.closest("aside, #sidebar, [role='listbox'], [role='menu'], select")) return;
            var m = el.getBoundingClientRect();
            if (!m.width) return;
            var box = el.closest("main, #app") || document.body;
            var nodes = box.querySelectorAll("img, svg");
            for (var h = 0; h < nodes.length; h++) {
              var n = nodes[h];
              if (n.closest("aside, #sidebar, textarea")) continue;
              var b = n.getBoundingClientRect();
              if (b.width < 8 || b.width > 56 || b.height > 56) continue;
              if (Math.abs((b.top + b.bottom) / 2 - (m.top + m.bottom) / 2) > 22) continue;
              if (b.right > m.left + 6) continue;
              if (m.left - b.right > 40) continue;
              n.style.display = "none";
              var wrap = n.parentElement;
              if (wrap && !wrap.querySelector("[data-jarvis-mark]")) {
                var w = wrap.getBoundingClientRect();
                if (w.width < 64 && w.height < 64) wrap.style.display = "none";
              }
            }
          }
          var nodes = document.querySelectorAll("aside *, #sidebar *, main *, #app *");
          for (var i = 0; i < nodes.length; i++) {
            var el = nodes[i];
            if (el.childNodes.length !== 1 || el.childNodes[0].nodeType !== 3) continue;
            var raw = el.childNodes[0].nodeValue;
            if (!raw) continue;
            var trimmed = raw.trim();
            if (trimmed.indexOf("(Open WebUI)") !== -1 && trimmed.indexOf("v0.") !== -1) {
              el.setAttribute("data-jarvis-foot", "1");
              continue;
            }
            if (raw.indexOf("(Open WebUI)") !== -1) {
              el.childNodes[0].nodeValue = raw.replace(/\s*\(Open WebUI\)/g, "");
              trimmed = el.childNodes[0].nodeValue.trim();
            }
            if (trimmed === "JARVIS") {
              el.setAttribute("data-jarvis-mark", "1");
              hideOwl(el);
            }
            if (trimmed === "jarvis") {
              if (el.closest("button, [role='button'], [role='menu'], [role='listbox'], [role='combobox'], select")) continue;
              el.setAttribute("data-jarvis-mark", "1");
              hideOwl(el);
            }
            if (trimmed === "jarvis-local") {
              if (el.closest("button, [role='button'], [role='menu'], [role='listbox']")) continue;
              el.setAttribute("data-jarvis-model", "1");
              var p = el.parentElement;
              if (p) {
                var hide = p.querySelectorAll("img, svg");
                for (var h = 0; h < hide.length; h++) hide[h].style.display = "none";
              }
            }
          }
        } catch (e) {}
      }
    
      var pending = null;
      function schedule() {
        if (pending) return;
        pending = setTimeout(function () {
          pending = null;
          once();
        }, 250);
      }
    
      once();
      setTimeout(once, 400);
      setTimeout(once, 1500);
    
      var root = document.documentElement;
      var obs = new MutationObserver(schedule);
      obs.observe(root, { childList: true, subtree: true });
    })();
  inject-hud.sh: |
    #!/bin/bash
    set -euo pipefail
    python3 - << 'HUDPY'
    from pathlib import Path
    import re
    css = Path("/hud/jarvis-hud.css").read_text()
    js = Path("/hud/jarvis-hud.js").read_text()
    p = Path("/app/build/index.html")
    t = p.read_text()
    t = re.sub(r"<!--jarvis-hud-->.*?<!--/jarvis-hud-->", "", t, flags=re.S)
    block = (
        "<!--jarvis-hud-->"
        "<style id=\"jarvis-hud\">" + css + "</style>"
        "<script id=\"jarvis-hud-js\">" + js + "</script>"
        "<!--/jarvis-hud-->"
    )
    if "<head>" in t:
        t = t.replace("<head>", "<head>" + block, 1)
    elif "</head>" in t:
        t = t.replace("</head>", block + "\n</head>", 1)
    else:
        t = block + t
    t = t.replace("<title>Open WebUI</title>", "<title>JARVIS</title>")
    p.write_text(t)
    print("hud v8 injected", len(css), len(js), flush=True)
    HUDPY
    for s in /app/backend/start.sh /app/start.sh start.sh; do
      if [ -f "$s" ]; then exec bash "$s"; fi
    done
    echo "FATAL: no start.sh" >&2
    exit 1

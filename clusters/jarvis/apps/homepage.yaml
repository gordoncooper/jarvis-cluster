apiVersion: v1
kind: ServiceAccount
metadata:
  name: homepage
  namespace: apps
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homepage-events
rules:
  - apiGroups: [""]
    resources: [events, pods, nodes]
    verbs: [get, list]
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    verbs: [get, list]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [gitrepositories]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homepage-events
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homepage-events
subjects:
  - kind: ServiceAccount
    name: homepage
    namespace: apps
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels: { app: homepage }
  strategy: { type: Recreate }
  template:
    metadata:
      labels: { app: homepage }
    spec:
      serviceAccountName: homepage
      nodeSelector:
        jarvis.role: apps
      containers:
        - name: homepage
          image: docker.io/library/jarvis-home:v0.4.9
          imagePullPolicy: Never
          env:
            - name: PROMETHEUS_URL
              value: http://prometheus.monitoring.svc:9090
          ports:
            - { name: http, containerPort: 3000 }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: apps
spec:
  selector: { app: homepage }
  ports:
    - { name: http, port: 3000, targetPort: http }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage
  namespace: apps
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts: [home.lan]
      secretName: lan-tls
  rules:
    - host: home.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: homepage, port: { number: 3000 } }

apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: apps
data:
  settings.yaml: |
    title: JARVIS
    headerStyle: clean
    statusStyle: dot
    theme: dark
    color: slate
    hideVersion: true
  widgets.yaml: |
    - datetime:
        text_size: xl
        format:
          dateStyle: medium
          timeStyle: short
    - search:
        provider: duckduckgo
        target: _blank
  services.yaml: |
    - JARVIS:
        - Chat:
            href: https://chat.lan
            description: Open WebUI (Whisper + Piper)
            siteMonitor: https://chat.lan
        - Agent:
            href: http://agent.lan:18789
            description: OpenClaw (port 18789, not 80)
            siteMonitor: http://192.168.8.16:18789
        - Grafana:
            href: http://grafana.lan
            description: Prometheus + GPU
            siteMonitor: http://grafana.lan
        - Gitea:
            href: http://git.lan
            description: GitOps
            siteMonitor: http://git.lan
        - LiteLLM:
            href: http://llm.lan
            description: OpenAI-compatible proxy
            siteMonitor: http://llm.lan
  bookmarks.yaml: |
    - Cluster:
        - docs:
            - abbr: LS
              href: https://chat.lan
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: homepage
    spec:
      nodeSelector:
        jarvis.role: apps
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v1.1.1
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "*"
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: cfg
              mountPath: /app/config/settings.yaml
              subPath: settings.yaml
            - name: cfg
              mountPath: /app/config/widgets.yaml
              subPath: widgets.yaml
            - name: cfg
              mountPath: /app/config/services.yaml
              subPath: services.yaml
            - name: cfg
              mountPath: /app/config/bookmarks.yaml
              subPath: bookmarks.yaml
            - name: logs
              mountPath: /app/config/logs
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: cfg
          configMap:
            name: homepage
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: apps
spec:
  selector:
    app: homepage
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage
  namespace: apps
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: home.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  number: 3000

apiVersion: apps/v1
kind: Deployment
metadata:
  name: jarvis-glass
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels: { app: jarvis-glass }
  strategy: { type: Recreate }
  template:
    metadata:
      labels: { app: jarvis-glass }
    spec:
      nodeSelector:
        jarvis.role: apps
      containers:
        - name: glass
          image: docker.io/library/jarvis-glass:v0.6.20
          imagePullPolicy: Never
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: jarvis-glass
  namespace: apps
spec:
  selector: { app: jarvis-glass }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jarvis-glass
  namespace: apps
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts: [jarvis.lan]
      secretName: lan-tls
  rules:
    - host: jarvis.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: jarvis-glass, port: { number: 8080 } }

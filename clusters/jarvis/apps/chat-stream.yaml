apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: stream-flush
  namespace: apps
spec:
  buffering:
    memRequestBodyBytes: 2048
---
# k3s Traefik IngressRoute with 1ms flush
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: open-webui-stream
  namespace: apps
spec:
  entryPoints: [web]
  routes:
    - match: Host(`chat.lan`) || Host(`jarvis.lan`)
      kind: Rule
      services:
        - name: open-webui
          port: 8080
          responseForwarding:
            flushInterval: 1ms

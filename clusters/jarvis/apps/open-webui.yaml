apiVersion: v1
kind: Namespace
metadata:
  name: apps
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels: { app: open-webui }
  strategy: { type: Recreate }
  template:
    metadata:
      labels: { app: open-webui }
    spec:
      nodeSelector:
        jarvis.role: apps
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:main
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: WEBUI_NAME, value: JARVIS }
            - { name: ENABLE_OLLAMA_API, value: "false" }
            - { name: OPENAI_API_BASE_URL, value: "http://litellm.inference.svc.cluster.local:4000/v1" }
            - name: OPENAI_API_KEY
              valueFrom: { secretKeyRef: { name: open-webui, key: OPENAI_API_KEY } }
            - name: WEBUI_SECRET_KEY
              valueFrom: { secretKeyRef: { name: open-webui, key: WEBUI_SECRET_KEY } }
            - { name: DEFAULT_MODELS, value: jarvis-local }
            - { name: ENABLE_SIGNUP, value: "true" }
            - { name: WEBUI_AUTH, value: "true" }
            - { name: ENABLE_NATIVE_FUNCTION_CALLING, value: "false" }
            - { name: USER_PERMISSIONS_WORKSPACE_TOOLS_ACCESS, value: "false" }
            - { name: ENABLE_FOLLOW_UP_GENERATION, value: "false" }
          volumeMounts:
            - { name: data, mountPath: /app/backend/data }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 2Gi }
      volumes:
        - name: data
          hostPath: { path: /cluster/local/open-webui, type: DirectoryOrCreate }
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: apps
spec:
  selector: { app: open-webui }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open-webui
  namespace: apps
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: chat.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: open-webui, port: { number: 8080 } }
    - host: jarvis.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: open-webui, port: { number: 8080 } }

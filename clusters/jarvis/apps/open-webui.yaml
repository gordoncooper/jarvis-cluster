apiVersion: v1
kind: Namespace
metadata:
  name: apps
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels: { app: open-webui }
  strategy: { type: Recreate }
  template:
    metadata:
      labels: { app: open-webui }
    spec:
      nodeSelector:
        jarvis.role: apps
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:v0.11.3@sha256:751b617714b91e4cfd0186a509c72480c858e012976103b09a30dad053c36175
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: WEBUI_NAME, value: JARVIS }
            - { name: DEFAULT_INTERFACE_SETTINGS, value: '{"theme":"oled"}' }
            - { name: ENABLE_OLLAMA_API, value: "false" }
            - { name: OPENAI_API_BASE_URL, value: "http://litellm.inference.svc.cluster.local:4000/v1" }
            - name: OPENAI_API_KEY
              valueFrom: { secretKeyRef: { name: open-webui, key: OPENAI_API_KEY } }
            - name: WEBUI_SECRET_KEY
              valueFrom: { secretKeyRef: { name: open-webui, key: WEBUI_SECRET_KEY } }
            - { name: DEFAULT_MODELS, value: jarvis }
            # DEFAULT_SYSTEM_PROMPT is not set: it does not inject a system
            # message per request (LESSONS). Character on chat.lan comes from
            # the Ollama Modelfile SYSTEM and the jarvis_persona filter.
            # Signup off: two accounts exist and this is a break-glass console
            # on a LAN with an admin on it. Turning it on is a deliberate act —
            # REBUILD documents the bootstrap.
            - { name: ENABLE_SIGNUP, value: "false" }
            - { name: WEBUI_AUTH, value: "true" }
            # ENABLE_NATIVE_FUNCTION_CALLING, ENABLE_MODEL_FILTER and
            # MODEL_FILTER_LIST were set here and do not exist in Open WebUI
            # v0.11.3 — zero references in the codebase. Removed rather than
            # left as false comfort (D-0039).
            #
            # Tool-calling is actually prevented by LiteLLM, which sets
            # supports_function_calling:false and drops tools/tool_choice/
            # functions for jarvis-local, plus no tools installed here and
            # USER_PERMISSIONS_WORKSPACE_TOOLS_ACCESS=false below. That is the
            # real guard for the scar VISION records; it is not this env var.
            #
            # The model picker is restricted by openai.api_configs.model_ids in
            # sqlite, written by scripts/seed-webui-ui.sh — not by an env var.
            - { name: ENABLE_EVALUATION_ARENA_MODELS, value: "false" }
            - { name: USER_PERMISSIONS_WORKSPACE_TOOLS_ACCESS, value: "false" }
            - { name: ENABLE_FOLLOW_UP_GENERATION, value: "false" }
            - { name: WEBUI_URL, value: "https://chat.lan" }
            - { name: WHISPER_MODEL, value: base }
            - { name: AUDIO_STT_ENGINE, value: "" }
            - { name: AUDIO_TTS_ENGINE, value: "openai" }
            - { name: AUDIO_TTS_OPENAI_API_BASE_URL, value: "http://piper.apps.svc.cluster.local:8000/v1" }
            - { name: AUDIO_TTS_OPENAI_API_KEY, value: "sk-local" }
            - { name: AUDIO_TTS_MODEL, value: "tts-1" }
            - { name: RAG_EMBEDDING_ENGINE, value: ollama }
            - { name: RAG_EMBEDDING_MODEL, value: nomic-embed-text }
            - { name: RAG_OLLAMA_BASE_URL, value: "http://ollama-embed.inference.svc.cluster.local:11434" }
          volumeMounts:
            - name: jarvis-persona
              mountPath: /etc/jarvis
              readOnly: true
            - { name: data, mountPath: /app/backend/data }
            - { name: learned, mountPath: /learned }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 4Gi }
      volumes:
        - name: jarvis-persona
          configMap:
            name: jarvis-persona
        - name: data
          hostPath: { path: /cluster/local/open-webui, type: DirectoryOrCreate }
        - name: learned
          hostPath: { path: /cluster/local/openclaw, type: DirectoryOrCreate }
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: apps
spec:
  selector: { app: open-webui }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open-webui
  namespace: apps
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: chat.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: open-webui, port: { number: 8080 } }
  tls:
    - secretName: lan-tls
      hosts:
        - chat.lan

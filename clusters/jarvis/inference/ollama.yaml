apiVersion: v1
kind: Namespace
metadata:
  name: inference
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: inference
spec:
  replicas: 1
  selector:
    matchLabels: { app: ollama }
  strategy: { type: Recreate }
  template:
    metadata:
      labels: { app: ollama }
    spec:
      nodeSelector:
        jarvis.role: gpu
        jarvis.gpu: chat
      runtimeClassName: nvidia
      containers:
        - name: ollama
          image: docker.io/ollama/ollama:latest@sha256:684d8674b4315fa18f4f0e973a118ec2652ed96f67563277839985175858e0ba
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 11434 }]
          env:
            - { name: OLLAMA_HOST, value: "0.0.0.0:11434" }
            - { name: NVIDIA_VISIBLE_DEVICES, value: all }
            - { name: NVIDIA_DRIVER_CAPABILITIES, value: compute,utility }
            - { name: OLLAMA_KEEP_ALIVE, value: "-1" }
          resources:
            requests: { nvidia.com/gpu: "1", memory: 4Gi }
            limits:   { nvidia.com/gpu: "1", memory: 12Gi }
          volumeMounts:
            - { name: models, mountPath: /root/.ollama }
      volumes:
        - name: models
          hostPath: { path: /mnt/nfs/models/ollama, type: DirectoryOrCreate }
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: inference
spec:
  selector: { app: ollama }
  ports: [{ name: http, port: 11434, targetPort: http }]

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-embed
  namespace: inference
spec:
  replicas: 1
  selector:
    matchLabels: { app: ollama-embed }
  strategy: { type: Recreate }
  template:
    metadata:
      labels: { app: ollama-embed }
    spec:
      nodeSelector:
        jarvis.role: gpu
        jarvis.gpu: perception
      runtimeClassName: nvidia
      containers:
        - name: ollama
          image: docker.io/ollama/ollama:latest
          ports: [{ name: http, containerPort: 11434 }]
          env:
            - { name: OLLAMA_HOST, value: "0.0.0.0:11434" }
            - { name: OLLAMA_KEEP_ALIVE, value: "-1" }
            - { name: NVIDIA_VISIBLE_DEVICES, value: all }
            - { name: NVIDIA_DRIVER_CAPABILITIES, value: compute,utility }
          resources:
            requests: { nvidia.com/gpu: "1", memory: 2Gi }
            limits:   { nvidia.com/gpu: "1", memory: 8Gi }
          volumeMounts:
            - { name: models, mountPath: /root/.ollama }
      volumes:
        - name: models
          hostPath: { path: /mnt/nfs/models/ollama-embed, type: DirectoryOrCreate }
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-embed
  namespace: inference
spec:
  selector: { app: ollama-embed }
  ports: [{ name: http, port: 11434, targetPort: http }]

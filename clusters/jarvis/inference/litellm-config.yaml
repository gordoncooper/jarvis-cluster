apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: inference
data:
  config.yaml: |
    model_list:
      - model_name: jarvis-local
        litellm_params:
          model: ollama/jarvis
          api_base: http://ollama.inference.svc.cluster.local:11434
          drop_params: true
          additional_drop_params: ["tools", "tool_choice", "functions"]
        model_info:
          supports_function_calling: false
      - model_name: jarvis-embed
        litellm_params:
          model: ollama/nomic-embed-text
          api_base: http://ollama-embed.inference.svc.cluster.local:11434
        model_info:
          mode: embedding
      - model_name: jarvis-grok
        litellm_params:
          model: xai/grok-4-fast
          api_key: os.environ/XAI_API_KEY
          drop_params: true
          additional_drop_params: ["max_completion_tokens"]
        rpm: 20
        tpm: 40000
      - model_name: jarvis-hands
        litellm_params:
          model: openai/openclaw
          api_base: http://openclaw.agents.svc.cluster.local:4001/v1
          api_key: sk-local
          drop_params: true
          timeout: 240
      - model_name: jarvis-grok-code
        litellm_params:
          model: xai/grok-code-fast-1
          api_key: os.environ/XAI_API_KEY
          drop_params: true
          additional_drop_params: ["max_completion_tokens"]
        rpm: 10
        tpm: 30000
      - model_name: jarvis
        litellm_params:
          model: auto_router/complexity_router
          drop_params: true
          complexity_router_config:
            tiers:
              SIMPLE: jarvis-local
              MEDIUM: jarvis-local
              COMPLEX: jarvis-hands
              REASONING: jarvis-grok-code
            keyword_tier_rules:
              - keywords: ["hi", "hello", "hey", "thanks", "who are you", "who am i", "good day", "good morning"]
                tier: SIMPLE
              - keywords: [
                  "cluster-health", "cluster-metrics", "nvidia-smi",
                  "kubectl get", "kubectl describe", "kubectl logs", "kubectl pods",
                  "are nodes ready", "are the nodes ready", "are nodes up", "are the nodes up",
                  "nodes ready", "get nodes", "get all nodes", "node status", "nodes status",
                  "get pods", "get all pods", "list pods", "list the pods", "are pods ready",
                  "are all pods ready", "are pods up", "pod status", "pods ready",
                  "live cluster health", "live telemetry"
                ]
                tier: COMPLEX
              - keywords: ["flux", "kustomization", "helm upgrade", "git commit", "write yaml", "patch deployment", "crashloop", "delete pod"]
                tier: REASONING
            custom_technical_keywords: [kubectl, flux, k3s, kubernetes, helm, etcd, traefik]
            session_affinity: false
            session_affinity_ttl_seconds: 3600
            return_raw_model_name: true
          complexity_router_default_model: jarvis-local
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY

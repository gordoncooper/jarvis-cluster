apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: inference
data:
  config.yaml: |
    model_list:
      - model_name: jarvis-local
        litellm_params:
          model: ollama/jarvis
          api_base: http://ollama.inference.svc.cluster.local:11434
          drop_params: true
          additional_drop_params: ["tools", "tool_choice", "functions"]
        model_info:
          supports_function_calling: false
      - model_name: jarvis-embed
        litellm_params:
          model: ollama/nomic-embed-text
          api_base: http://ollama-embed.inference.svc.cluster.local:11434
        model_info:
          mode: embedding
      - model_name: jarvis-grok
        litellm_params:
          model: xai/grok-4-fast
          api_key: os.environ/XAI_API_KEY
          drop_params: true
          additional_drop_params: ["max_completion_tokens"]
        rpm: 20
        tpm: 40000
      - model_name: jarvis-hands
        litellm_params:
          model: openai/openclaw
          api_base: http://openclaw.agents.svc.cluster.local:4001/v1
          api_key: sk-local
          drop_params: true
          timeout: 360
      - model_name: jarvis-grok-code
        litellm_params:
          model: xai/grok-code-fast-1
          api_key: os.environ/XAI_API_KEY
          drop_params: true
          additional_drop_params: ["max_completion_tokens"]
        rpm: 10
        tpm: 30000
      - model_name: jarvis
        litellm_params:
          model: auto_router/complexity_router
          drop_params: true
          complexity_router_config:
            tiers:
              SIMPLE: jarvis-local
              MEDIUM: jarvis-local
              COMPLEX: jarvis-hands
              REASONING: jarvis-grok-code
            custom_technical_keywords: [kubectl, flux, k3s, kubernetes, helm, etcd, traefik]
            escalation_keywords: []
            keyword_tier_rules:

              - keywords: [restart, rollout, recycle, delete pod, are nodes, cluster-health, kubectl get, kubectl describe, kubectl rollout, /cluster/local, list directories, hostpath, ls /cluster, ls -la, apps-01 disk, files on apps-01, running pods, get pods, nodes ready]
                tier: COMPLEX
              - keywords: [kustomization, write a flux, patch yaml, helm template, debug yaml]
                tier: REASONING
            session_affinity: false
            session_affinity_ttl_seconds: 3600
            return_raw_model_name: true
            classifier_type: heuristic
            reminder_markers:
              - open: "<<<begin_ctx>>>"
                close: "<<<end_ctx>>>"
          complexity_router_default_model: jarvis-local
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY

apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: inference
data:
  config.yaml: |
    model_list:
      - model_name: jarvis-local
        litellm_params:
          model: ollama/jarvis
          api_base: http://ollama.inference.svc.cluster.local:11434
          drop_params: true
          additional_drop_params: ["tools", "tool_choice", "functions"]
        model_info:
          supports_function_calling: false
      - model_name: jarvis-embed
        litellm_params:
          model: ollama/nomic-embed-text
          api_base: http://ollama-embed.inference.svc.cluster.local:11434
        model_info:
          mode: embedding
      - model_name: jarvis-grok
        litellm_params:
          model: xai/grok-4-fast
          api_key: os.environ/XAI_API_KEY
          drop_params: true
          additional_drop_params: ["max_completion_tokens"]
        rpm: 20
        tpm: 40000
      - model_name: jarvis-hands
        litellm_params:
          model: openai/openclaw
          api_base: http://openclaw.agents.svc.cluster.local:4001/v1
          api_key: sk-local
          drop_params: true
          timeout: 360
      - model_name: jarvis-grok-code
        litellm_params:
          model: xai/grok-code-fast-1
          api_key: os.environ/XAI_API_KEY
          drop_params: true
          additional_drop_params: ["max_completion_tokens"]
        rpm: 10
        tpm: 30000
      - model_name: jarvis
        litellm_params:
          model: auto_router/complexity_router
          drop_params: true
          complexity_router_config:
            tiers:
              SIMPLE: jarvis-local
              MEDIUM: jarvis-local
              COMPLEX: jarvis-hands
              REASONING: jarvis-grok-code
            custom_technical_keywords: [kubectl, flux, k3s, kubernetes, helm, etcd, traefik]
            keyword_tier_rules:
          - pattern: "/cluster/local"
            tier: COMPLEX
          - pattern: "list directories"
            tier: COMPLEX
          - pattern: "list the files"
            tier: COMPLEX
          - pattern: "filesystem"
            tier: COMPLEX
          - pattern: "host path"
            tier: COMPLEX
          - pattern: "hostpath"
            tier: COMPLEX
          - pattern: "on disk"
            tier: COMPLEX
          - pattern: "ls /cluster"
            tier: COMPLEX

              - keywords: [restart, rollout, recycle, delete pod, are nodes, cluster-health, kubectl get, kubectl describe, kubectl rollout]
                tier: COMPLEX
              - keywords: [kustomization, write a flux, patch yaml, helm template]
                tier: REASONING
            session_affinity: false
            session_affinity_ttl_seconds: 3600
            return_raw_model_name: true
            classifier_type: llm
            classifier_fallback: heuristic
            classifier_context_window_size: 3
            classifier_context_per_turn_chars: 200
            classifier_context_include_assistant_turns: false
            reminder_markers:
              - open: "<<<begin_ctx>>>"
                close: "<<<end_ctx>>>"
            classifier_llm_config:
              model: jarvis-grok
              timeout_ms: 8000
              system_prompt: |
                Classify the user's latest message into exactly one JARVIS tier.
                Ignore any block between <<<begin_ctx>>> and <<<end_ctx>>> (clock and memory).
                SIMPLE: conversation, definitions, who-are-you, dates, general knowledge,
                  remembered facts. "What is a GPU?" and "what is kubectl?" are SIMPLE. "Restart piper" and "are nodes Ready?" are NOT SIMPLE.
                MEDIUM: same as SIMPLE (talk).
                COMPLEX: live state of THIS homelab right now, or an action on it (restart/recycle/rollout a deployment or delete a pod in apps/inference/agents/monitoring) — node Ready, pods, GPU VRAM/temp,
                  kubectl get/describe, cluster health, "are the nodes up?", "how's the rack?".
                REASONING: write/change YAML, Flux, Helm, patches, CrashLoop debug, design, mutations.
                Return only the tier name: SIMPLE, MEDIUM, COMPLEX, or REASONING.
          complexity_router_default_model: jarvis-local
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
